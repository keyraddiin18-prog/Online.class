<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Browse all available classes on KEYRADDIIN ONLINE CLASS."
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>Classes | KEYRADDIIN ONLINE CLASS</title>

    <link
        rel="icon"
        type="image/png"
        href="../assets/favicon.png"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>
        /* =================================================
           CLASSES PAGE
        ================================================= */

        .classes-page {
            min-height: 100vh;
            background: #f8fafc;
        }

        .classes-hero {
            padding: 55px 0 35px;
            background:
                radial-gradient(
                    circle at 90% 0%,
                    rgba(37, 99, 235, 0.10),
                    transparent 35%
                ),
                #f8fafc;
        }

        .classes-hero-content {
            max-width: 760px;
        }

        .classes-hero h1 {
            margin-top: 10px;
            color: #0f172a;
            font-size: clamp(38px, 7vw, 60px);
            line-height: 1.05;
            letter-spacing: -2px;
        }

        .classes-hero p {
            margin-top: 14px;
            color: #64748b;
            font-size: 17px;
        }

        .classes-toolbar {
            padding: 20px 0 10px;
        }

        .classes-toolbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 240px;
        }

        .search-box input {
            width: 100%;
            min-height: 52px;
            padding: 0 18px 0 48px;

            background: #ffffff;
            color: #0f172a;

            border: 1px solid #e2e8f0;
            border-radius: 14px;

            outline: none;

            font-size: 14px;
        }

        .search-box input:focus {
            border-color: #93c5fd;

            box-shadow:
                0 0 0 4px rgba(
                    37,
                    99,
                    235,
                    0.08
                );
        }

        .search-icon {
            position: absolute;

            left: 17px;
            top: 50%;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 18px;

            pointer-events: none;
        }

        .class-count {
            color: #64748b;
            font-size: 13px;
            font-weight: 700;
        }

        .subject-filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0 5px;

            scrollbar-width: none;
        }

        .subject-filters::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            flex-shrink: 0;

            min-height: 40px;
            padding: 0 15px;

            border: 1px solid #e2e8f0;
            border-radius: 999px;

            background: #ffffff;
            color: #475569;

            cursor: pointer;

            font-size: 13px;
            font-weight: 700;
        }

        .filter-btn.active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        .classes-section {
            padding: 30px 0 90px;
        }

        .classes-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 20px;
        }

        .class-card {
            overflow: hidden;

            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 22px;

            box-shadow:
                0 5px 20px rgba(
                    15,
                    23,
                    42,
                    0.04
                );

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .class-card:hover {
            transform: translateY(-5px);

            border-color: #bfdbfe;

            box-shadow:
                0 18px 40px rgba(
                    15,
                    23,
                    42,
                    0.09
                );
        }

        .class-card-header {
            min-height: 155px;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #2563eb
                );

            color: #ffffff;
        }

        .class-subject-icon {
            width: 78px;
            height: 78px;

            display: grid;
            place-items: center;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.16
                );

            border-radius: 22px;

            font-size: 38px;
        }

        .class-card-body {
            padding: 23px;
        }

        .class-status {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            min-height: 30px;

            padding: 0 10px;

            border-radius: 999px;

            background: #f1f5f9;

            color: #64748b;

            font-size: 11px;

            font-weight: 850;

            letter-spacing: 0.5px;
        }

        .class-status.live {
            background: #dcfce7;
            color: #15803d;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #94a3b8;
        }

        .class-status.live .status-dot {
            background: #22c55e;
        }

        .class-card h2 {
            margin-top: 16px;

            color: #172033;

            font-size: 22px;

            line-height: 1.2;

            letter-spacing: -0.5px;
        }

        .class-meta {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 7px;

            margin-top: 9px;

            color: #64748b;

            font-size: 13px;
        }

        .class-description {
            margin-top: 13px;

            color: #94a3b8;

            font-size: 13px;

            line-height: 1.55;
        }

        .class-teacher {
            margin-top: 18px;

            padding-top: 17px;

            border-top:
                1px solid #f1f5f9;

            color: #64748b;

            font-size: 12px;
        }

        .class-teacher strong {
            color: #172033;
        }

        .view-class-btn {
            width: 100%;

            min-height: 50px;

            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-top: 20px;

            padding: 0 17px;

            background: #0f172a;

            color: #ffffff;

            border-radius: 13px;

            font-size: 14px;

            font-weight: 800;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .view-class-btn:hover {
            background: #1e293b;
            transform: translateY(-2px);
        }

        .empty-state {
            grid-column: 1 / -1;

            padding: 70px 25px;

            text-align: center;

            background: #ffffff;

            border: 1px dashed #cbd5e1;

            border-radius: 22px;
        }

        .empty-icon {
            font-size: 42px;
        }

        .empty-state h2 {
            margin-top: 15px;

            color: #172033;

            font-size: 22px;
        }

        .empty-state p {
            max-width: 500px;

            margin: 8px auto 0;

            color: #64748b;

            font-size: 14px;
        }

        .loading-state {
            grid-column: 1 / -1;

            padding: 60px 20px;

            text-align: center;

            color: #64748b;
        }

        .loading-spinner {
            width: 38px;
            height: 38px;

            margin: 0 auto 15px;

            border:
                4px solid #e2e8f0;

            border-top-color: #2563eb;

            border-radius: 50%;

            animation:
                classSpin 0.8s linear infinite;
        }

        @keyframes classSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-state {
            grid-column: 1 / -1;

            padding: 30px;

            text-align: center;

            background: #fff7ed;

            border: 1px solid #fed7aa;

            border-radius: 18px;

            color: #9a3412;
        }

        @media (max-width: 600px) {

            .classes-hero {
                padding-top: 40px;
            }

            .classes-hero h1 {
                font-size: 40px;
            }

            .classes-hero p {
                font-size: 15px;
            }

            .classes-grid {
                grid-template-columns: 1fr;
            }

            .classes-toolbar-inner {
                align-items: stretch;
                flex-direction: column;
            }

            .search-box {
                min-width: 100%;
            }
        }
    </style>
</head>


<body>

    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="site-header">

        <div class="header-container">

            <a
                href="../index.html"
                class="brand"
            >

                <img
                    src="../assets/logo.png"
                    alt="KEYRADDIIN ONLINE CLASS"
                    class="brand-logo"
                >

                <div class="brand-text">

                    <strong>
                        KEYRADDIIN ONLINE CLASS
                    </strong>

                    <span>
                        Live Learning Platform
                    </span>

                </div>

            </a>


            <a
                href="../index.html"
                class="login-btn"
            >
                ← Home
            </a>

        </div>

    </header>



    <!-- =================================================
         PAGE
    ================================================== -->

    <main class="classes-page">


        <!-- HERO -->

        <section class="classes-hero">

            <div class="section-container">

                <div class="classes-hero-content">

                    <span class="section-label">
                        CLASSES
                    </span>

                    <h1>
                        Online Classes
                    </h1>

                    <p>
                        Explore available classes and start learning.
                    </p>

                </div>

            </div>

        </section>



        <!-- TOOLBAR -->

        <section class="classes-toolbar">

            <div class="section-container">

                <div class="classes-toolbar-inner">

                    <div class="search-box">

                        <span class="search-icon">
                            🔎
                        </span>

                        <input
                            type="search"
                            id="classSearch"
                            placeholder="Search classes..."
                            autocomplete="off"
                        >

                    </div>


                    <div
                        class="class-count"
                        id="classCount"
                    >
                        Loading classes...
                    </div>

                </div>


                <!-- Dynamic filters -->

                <div
                    class="subject-filters"
                    id="subjectFilters"
                >
                </div>

            </div>

        </section>



        <!-- CLASSES -->

        <section class="classes-section">

            <div class="section-container">

                <div
                    class="classes-grid"
                    id="classesGrid"
                >

                    <div class="loading-state">

                        <div class="loading-spinner"></div>

                        <p>
                            Loading classes...
                        </p>

                    </div>

                </div>

            </div>

        </section>


    </main>



    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer class="site-footer">

        <div class="footer-container">

            <div class="footer-brand">

                <img
                    src="../assets/logo.png"
                    alt="KEYRADDIIN ONLINE CLASS"
                >

                <div>

                    <strong>
                        KEYRADDIIN ONLINE CLASS
                    </strong>

                    <p>
                        Live Learning Platform
                    </p>

                </div>

            </div>


            <div class="footer-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="classes.html">
                    Classes
                </a>

                <a href="login.html">
                    Student Login
                </a>

            </div>


            <div class="footer-bottom">

                <p>
                    ©
                    <span id="year"></span>
                    KEYRADDIIN ONLINE CLASS.
                    All rights reserved.
                </p>

            </div>

        </div>

    </footer>



    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script
        type="module"
        src="../js/classes.js"
    ></script>

</body>

</html>
