<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | KEYRADDIIN ONLINE CLASS</title>

    <link rel="icon" href="../assets/favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8fd;
            color: #172033;
        }

        .header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 16px 18px;
        }

        .header-inner {
            max-width: 1000px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            color: #0b3d91;
            font-weight: 800;
        }

        .back {
            color: #0b3d91;
            font-size: 13px;
            font-weight: 700;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 35px 18px;
        }

        .profile-card {
            background: white;
            border: 1px solid #e1e7f0;
            border-radius: 15px;
            padding: 30px;
        }

        .profile-top {
            text-align: center;
            margin-bottom: 25px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: auto;
            background: #edf4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        .profile-top h1 {
            font-size: 22px;
            margin-top: 13px;
        }

        .profile-top p {
            color: #697386;
            font-size: 13px;
        }

        .info {
            border-top: 1px solid #edf0f5;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            font-size: 13px;
        }

        .label {
            color: #697386;
        }

        .value {
            font-weight: 700;
            text-align: right;
        }

        .edit {
            display: block;
            text-align: center;
            margin-top: 20px;
            background: #0b3d91;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        @media (max-width: 500px) {
            .profile-card {
                padding: 22px 17px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div class="brand">
            KEYRADDIIN ONLINE CLASS
        </div>

        <a
            href="student-dashboard.html"
            class="back"
        >
            ← Dashboard
        </a>

    </div>

</header>


<main class="container">

    <section class="profile-card">


        <div class="profile-top">

            <div class="avatar">
                👨‍🎓
            </div>

            <h1>
                Student Name
            </h1>

            <p>
                Grade 10 • Section A
            </p>

        </div>


        <div class="info">

            <span class="label">
                Student ID
            </span>

            <span class="value">
                KM-00000001
            </span>

        </div>


        <div class="info">

            <span class="label">
                Full Name
            </span>

            <span class="value">
                Student Name
            </span>

        </div>


        <div class="info">

            <span class="label">
                Grade
            </span>

            <span class="value">
                Grade 10
            </span>

        </div>


        <div class="info">

            <span class="label">
                Section
            </span>

            <span class="value">
                A
            </span>

        </div>


        <div class="info">

            <span class="label">
                Role
            </span>

            <span class="value">
                Student
            </span>

        </div>


        <a
            href="#"
            class="edit"
        >
            Edit Profile
        </a>

    </section>

</main>

</body>
</html>
