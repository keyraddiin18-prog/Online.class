<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | KEYRADDIIN ONLINE CLASS</title>

    <link rel="icon" href="../assets/favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8fd;
            color: #172033;
            min-height: 100vh;
        }

        .header {
            background: #ffffff;
            border-bottom: 1px solid #e5eaf2;
            padding: 15px 20px;
        }

        .brand {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            border-radius: 8px;
        }

        .brand-name {
            color: #0b3d91;
            font-size: 17px;
            font-weight: 800;
        }

        .brand-subtitle {
            color: #697386;
            font-size: 11px;
        }

        .login-wrapper {
            min-height: calc(100vh - 73px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 18px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 1px solid #e1e7f0;
            border-radius: 16px;
            padding: 30px 24px;
            box-shadow: 0 15px 40px rgba(20, 50, 90, 0.07);
        }

        .login-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            background: #edf4ff;
            color: #0b3d91;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .intro {
            text-align: center;
            color: #697386;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            height: 48px;
            border: 1px solid #d8dfeb;
            border-radius: 8px;
            padding: 0 13px;
            font-size: 14px;
            outline: none;
            background: #ffffff;
        }

        input:focus,
        select:focus {
            border-color: #0b3d91;
        }

        .login-button {
            width: 100%;
            height: 49px;
            border: none;
            border-radius: 9px;
            background: #0b3d91;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #082f70;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b3d91;
            font-size: 13px;
            font-weight: 700;
        }

        .notice {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #f3f7fd;
            color: #667085;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="brand">

        <img
            src="../assets/logo.png"
            alt="KEYRADDIIN ONLINE CLASS"
        >

        <div>
            <div class="brand-name">
                KEYRADDIIN ONLINE CLASS
            </div>

            <div class="brand-subtitle">
                Live Learning Platform
            </div>
        </div>

    </div>
</header>


<main class="login-wrapper">

    <div class="login-card">

        <div class="login-icon">
            🎓
        </div>

        <h1>
            Student Login
        </h1>

        <p class="intro">
            Login to access your online classes and learning dashboard.
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="studentId">
                    Student ID
                </label>

                <input
                    type="text"
                    id="studentId"
                    placeholder="Enter your Student ID"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login to Dashboard
            </button>

        </form>


        <div class="notice">
            🔒 Your account information will be securely protected.
        </div>


        <a
            href="../index.html"
            class="back"
        >
            ← Back to Home
        </a>

    </div>

</main>


<script>
    document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            window.location.href =
                "student-dashboard.html";

        });
</script>

</body>
</html>
