<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Dashboard | KEYRADDIIN ONLINE CLASS</title>

    <link rel="icon" href="../assets/favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8fd;
            color: #172033;
        }

        a {
            text-decoration: none;
        }

        .header {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 15px 18px;
        }

        .header-inner {
            max-width: 1150px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            color: #0b3d91;
            font-weight: 800;
        }

        .logout {
            color: #d32f2f;
            font-size: 13px;
            font-weight: 700;
        }

        .container {
            max-width: 1150px;
            margin: auto;
            padding: 30px 18px;
        }

        .welcome h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .welcome p {
            color: #697386;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            border: 1px solid #e1e7f0;
            border-radius: 12px;
            padding: 20px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 800;
            color: #0b3d91;
        }

        .stat-label {
            color: #697386;
            font-size: 13px;
        }

        .panel {
            background: white;
            border: 1px solid #e1e7f0;
            border-radius: 14px;
            padding: 20px;
        }

        .panel h2 {
            font-size: 20px;
            margin-bottom: 18px;
        }

        .class {
            padding: 16px;
            background: #f6f8fc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .class h3 {
            font-size: 15px;
        }

        .class p {
            color: #697386;
            font-size: 12px;
            margin-top: 4px;
        }

        .start {
            background: #e53935;
            color: white;
            padding: 10px 15px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 800;
        }

        @media (max-width: 650px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .class {
                flex-direction: column;
                align-items: flex-start;
            }

            .start {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="header-inner">

        <div class="brand">
            KEYRADDIIN ONLINE CLASS
        </div>

        <a href="login.html" class="logout">
            Logout
        </a>

    </div>
</header>


<main class="container">

    <section class="welcome">

        <h1>
            Teacher Dashboard 👨‍🏫
        </h1>

        <p>
            Manage your online classes and live lessons.
        </p>

    </section>


    <section class="stats">

        <div class="stat">
            <div class="stat-number">4</div>
            <div class="stat-label">My Classes</div>
        </div>

        <div class="stat">
            <div class="stat-number">128</div>
            <div class="stat-label">Students</div>
        </div>

        <div class="stat">
            <div class="stat-number">12</div>
            <div class="stat-label">Lessons</div>
        </div>

    </section>


    <section class="panel">

        <h2>
            Today's Classes
        </h2>

        <div class="class">

            <div>

                <h3>
                    Biology — Unit 1
                </h3>

                <p>
                    Grade 10 • Section A • 👥 37 Students
                </p>

            </div>

            <a
                href="live-class.html"
                class="start"
            >
                🔴 Start Live Class
            </a>

        </div>

    </section>

</main>

</body>
</html>
